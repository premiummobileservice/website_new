services:
  - type: web
    name: premiummobileservice-api
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "True"
      - key: USE_SQLITE
        value: "True"
      - key: USE_REDIS
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: ALLOWED_HOSTS
        value: "*,localhost,127.0.0.1,.onrender.com,.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "premiummobileservice3@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "wdsbruqkmdrabfnm"
      - key: DEFAULT_FROM_EMAIL
        value: "Premium Mobile Repair <premiummobileservice3@gmail.com>"
      - key: LEAD_NOTIFY_EMAILS
        value: "premiummobileservice3@gmail.com"
