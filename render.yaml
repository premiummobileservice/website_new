services:
  - type: web
    name: premium-mobile-repair-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "True"
      - key: USE_SQLITE
        value: "True"
      - key: USE_REDIS
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: ALLOWED_HOSTS
        value: "*,localhost,127.0.0.1,.onrender.com,.vercel.app"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://website-eight-ebon-78.vercel.app,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.vercel.app,https://*.onrender.com"
      - key: CRM_BASE_URL
        value: "https://website-eight-ebon-78.vercel.app"
